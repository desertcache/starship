<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starship Explorer</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230A0B10'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%23C7641E' stroke-width='1.5'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%231C1E22' stroke='%2346E0D8' stroke-width='1.5'/%3E%3Ccircle cx='16' cy='16' r='2.4' fill='%2346E0D8'/%3E%3C/svg%3E" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #0A0B10; overflow: hidden; }
      canvas { display: block; width: 100vw; height: 100vh; }
      /* The told wait: plain HTML, so it paints before the bundle arrives. main.ts removes it on
         the first rendered frame, the same moment window.__ready resolves. The pulse is opacity
         only, so the compositor keeps it moving while the scene build holds the main thread. */
      .boot {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        padding: 24px; color: #E8E2D4; text-align: center; pointer-events: none;
        font: 12px/1.8 ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0.24em; text-transform: uppercase;
        animation: boot-pulse 1.8s ease-in-out infinite;
      }
      @keyframes boot-pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 0.95; } }
      @media (prefers-reduced-motion: reduce) { .boot { animation: none; opacity: 0.85; } }
    </style>
  </head>
  <body>
    <p id="boot" class="boot" role="status">Building the ship in your browser. This takes a few seconds.</p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
